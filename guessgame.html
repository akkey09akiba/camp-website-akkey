<!DOCTYPE html>
<html lang="ja">
<head>
  <title>数当てゲーム</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background:
        radial-gradient(ellipse at 30% 20%, rgba(80, 120, 220, 0.3) 0%, transparent 55%),
        radial-gradient(ellipse at 70% 80%, rgba(140, 60, 200, 0.25) 0%, transparent 50%),
        linear-gradient(160deg, #070d20 0%, #0d1535 50%, #130820 100%);
      min-height: 100vh;
      font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      color: #e8eaf6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.8) 0%, transparent 100%),
        radial-gradient(1px 1px at 30% 8%,  rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 55% 20%, rgba(255,255,255,0.9) 0%, transparent 100%),
        radial-gradient(1px 1px at 78% 12%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 35%, rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 20% 55%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 65% 60%, rgba(255,255,255,0.8) 0%, transparent 100%),
        radial-gradient(1px 1px at 45% 80%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 85% 75%, rgba(200,200,255,0.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 5%  90%, rgba(255,255,255,0.6) 0%, transparent 100%);
    }

    header {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(6,11,24,0.95), transparent);
      z-index: 10;
    }

    header .logo {
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      color: #a5c4f3;
    }

    header a {
      color: #c5d8f5;
      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      transition: color 0.2s;
    }

    header a:hover { color: #fff; }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 3rem 2.5rem 2.5rem;
      width: min(420px, 90vw);
      text-align: center;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
    }

    .eyecatch {
      font-size: 0.72rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #7baee8;
      margin-bottom: 0.5rem;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: bold;
      letter-spacing: 0.1em;
      background: linear-gradient(135deg, #e8f4ff 0%, #a8d4ff 40%, #c8a8ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.4rem;
    }

    .subtitle {
      font-size: 0.82rem;
      color: #6a90b8;
      letter-spacing: 0.08em;
      margin-bottom: 2rem;
    }

    .input-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 0.8rem;
    }

    label {
      font-size: 0.9rem;
      color: #a5c4f3;
      letter-spacing: 0.05em;
    }

    #guessField {
      width: 100px;
      border: 1px solid rgba(160, 200, 255, 0.3);
      border-radius: 10px;
      padding: 0.5rem 0.8rem;
      font-size: 1.1rem;
      text-align: center;
      background: rgba(255, 255, 255, 0.08);
      color: #e8eaf6;
      transition: border-color 0.2s, background 0.2s;
    }

    #guessField:focus {
      outline: none;
      border-color: rgba(160, 200, 255, 0.7);
      background: rgba(255, 255, 255, 0.13);
    }

    input[type="submit"], input[type="button"] {
      border: none;
      border-radius: 10px;
      padding: 0.5rem 1.3rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.2s;
      width: auto;
    }

    input[type="submit"]:hover:not(:disabled),
    input[type="button"]:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }

    #guessSubmit {
      background: linear-gradient(135deg, #a8d4ff, #5588c8);
      color: #070d20;
    }

    #guessSubmit:disabled {
      background: rgba(160, 200, 255, 0.2);
      color: #5a7a9a;
      cursor: default;
      transform: none;
      box-shadow: none;
    }

    #guessReset {
      background: rgba(255, 255, 255, 0.08);
      color: #a5c4f3;
      border: 1px solid rgba(160, 200, 255, 0.25);
    }

    #guessRemaining {
      font-size: 0.82rem;
      color: #5a80a8;
      letter-spacing: 0.05em;
      margin: 1rem 0 0.3rem;
    }

    #guessResult {
      font-size: 1.1rem;
      font-weight: bold;
      color: #a8d4ff;
      min-height: 1.6rem;
      margin-top: 0.3rem;
      letter-spacing: 0.05em;
    }

    #guessCat { font-size: 3.5rem; margin-top: 0.5rem; }

    .back-link {
      display: inline-block;
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #5588a0;
      text-decoration: none;
      letter-spacing: 0.1em;
      border-bottom: 1px solid rgba(100, 150, 200, 0.3);
      transition: color 0.2s;
    }

    .back-link:hover { color: #a8d4ff; }
  </style>
</head>
<body>

  <header>
    <span class="logo">数当てゲーム</span>
    <a href="index.html">← トップへ</a>
  </header>

  <div class="card">
    <p class="eyecatch">Guess Game</p>
    <h1>数当てゲーム</h1>
    <p class="subtitle">1〜100の数字を当てよう　残り10回</p>

    <div id="guessGame">
      <div class="input-row">
        <label for="guessField">予想:</label>
        <input type="number" min="1" max="100" id="guessField">
        <input type="submit" value="予想を入力" id="guessSubmit">
        <input type="button" value="リセット" id="guessReset">
      </div>
      <p id="guessRemaining">残り試行回数: 10</p>
      <p id="guessResult"></p>
      <p id="guessCat" style="display: none;">🐱</p>
    </div>

    <a class="back-link" href="index.html">トップページへ戻る</a>
  </div>

<script>
  const MAX_TRIES = 10;

  let answerNumber = Math.floor(Math.random() * 100) + 1;
  console.log('正解は' + answerNumber);

  let remainingTries = MAX_TRIES;

  let guessField = document.querySelector('#guessField');
  let guessSubmit = document.querySelector('#guessSubmit');
  let guessResult = document.querySelector('#guessResult');
  let guessCat = document.querySelector('#guessCat');
  let guessRemaining = document.querySelector('#guessRemaining');

  function checkGuess() {
    let userGuess = Number(guessField.value);
    remainingTries--;
    guessField.value = '';

    if (userGuess === answerNumber) {
      guessResult.textContent = '正解です！';
      guessCat.style.display = 'block';
      guessRemaining.textContent = '';
      guessSubmit.disabled = true;
    } else if (remainingTries === 0) {
      guessResult.textContent = 'ゲームオーバー！正解は ' + answerNumber + ' でした。';
      guessRemaining.textContent = '残り試行回数: 0';
      guessSubmit.disabled = true;
    } else if (userGuess < answerNumber) {
      guessResult.textContent = 'もっと大きいです';
      guessRemaining.textContent = '残り試行回数: ' + remainingTries;
    } else {
      guessResult.textContent = 'もっと小さいです';
      guessRemaining.textContent = '残り試行回数: ' + remainingTries;
    }
  }

  guessSubmit.addEventListener('click', checkGuess);

  let guessReset = document.querySelector('#guessReset');

  function resetGame() {
    answerNumber = Math.floor(Math.random() * 100) + 1;
    console.log('正解は' + answerNumber);
    remainingTries = MAX_TRIES;
    guessField.value = '';
    guessResult.textContent = '';
    guessCat.style.display = 'none';
    guessRemaining.textContent = '残り試行回数: ' + MAX_TRIES;
    guessSubmit.disabled = false;
  }

  guessReset.addEventListener('click', resetGame);
</script>

  <canvas id="glitterCanvas" style="position:fixed;inset:0;pointer-events:none;z-index:50;"></canvas>

<script>
  (function() {
    const glCanvas = document.getElementById('glitterCanvas');
    const glCtx = glCanvas.getContext('2d');

    function resize() {
      glCanvas.width  = window.innerWidth;
      glCanvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const PARTICLE_COUNT = 120;
    const particles = [];
    const colors = [
      'rgba(255,255,255,', 'rgba(200,220,255,',
      'rgba(180,200,255,', 'rgba(220,180,255,', 'rgba(160,230,255,',
    ];

    function randomParticle(p) {
      p.x      = Math.random() * glCanvas.width;
      p.y      = Math.random() * glCanvas.height;
      p.size   = Math.random() * 1.8 + 0.4;
      p.color  = colors[Math.floor(Math.random() * colors.length)];
      p.alpha  = 0;
      p.target = Math.random() * 0.8 + 0.2;
      p.speed  = Math.random() * 0.015 + 0.005;
      p.phase  = Math.random() < 0.5 ? 'in' : 'out';
      p.drift  = (Math.random() - 0.5) * 0.3;
    }

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const p = {};
      randomParticle(p);
      p.alpha = Math.random();
      particles.push(p);
    }

    function drawStar(x, y, size, alpha, color) {
      glCtx.save();
      glCtx.translate(x, y);
      glCtx.globalAlpha = alpha;
      const gradient = glCtx.createRadialGradient(0, 0, 0, 0, 0, size * 4);
      gradient.addColorStop(0, color + '1)');
      gradient.addColorStop(0.3, color + (alpha * 0.6).toFixed(2) + ')');
      gradient.addColorStop(1, color + '0)');
      for (let angle of [0, Math.PI / 2]) {
        glCtx.save();
        glCtx.rotate(angle);
        glCtx.beginPath();
        glCtx.moveTo(-size * 4, 0);
        glCtx.lineTo(size * 4, 0);
        glCtx.strokeStyle = color + (alpha * 0.4).toFixed(2) + ')';
        glCtx.lineWidth = size * 0.6;
        glCtx.stroke();
        glCtx.restore();
      }
      glCtx.beginPath();
      glCtx.arc(0, 0, size, 0, Math.PI * 2);
      glCtx.fillStyle = gradient;
      glCtx.fill();
      glCtx.restore();
    }

    function animate() {
      glCtx.clearRect(0, 0, glCanvas.width, glCanvas.height);
      for (const p of particles) {
        if (p.phase === 'in') {
          p.alpha += p.speed;
          if (p.alpha >= p.target) p.phase = 'out';
        } else {
          p.alpha -= p.speed;
          if (p.alpha <= 0) randomParticle(p);
        }
        p.x += p.drift;
        drawStar(p.x, p.y, p.size, Math.max(0, p.alpha), p.color);
      }
      requestAnimationFrame(animate);
    }
    animate();
  })();
</script>

</body>
</html>
